/* Layout idea: phone-first single column. Record = one big entry card under a row of athlete chips.
   Report = one sheet per athlete, big numbers first, small charts beside them. */
:root{
  --bg:#ffffff; --card:#f6f5fb; --ink:#17132b; --muted:#625c7c; --line:#e2dff0;
  --pink:#e5007d; --purple:#6a2bd9; --blue:#0b6fe8; --ok:#0f8a5f; --warn:#b45309;
  --track:#e7e4f3; --on-accent:#ffffff;

}
@media (prefers-color-scheme: dark){

    color-scheme:dark;
    --bg:#0f0c1f; --card:#1a1632; --ink:#f3f1fb; --muted:#aaa4c6; --line:#2e2850;
    --pink:#ff4fa8; --purple:#a583ff; --blue:#59a6ff; --ok:#4fd6a4; --warn:#f5b55a;
    --track:#2a2448; --on-accent:#120f24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0c1f; --card:#1a1632; --ink:#f3f1fb; --muted:#aaa4c6; --line:#2e2850;
  --pink:#ff4fa8; --purple:#a583ff; --blue:#59a6ff; --ok:#4fd6a4; --warn:#f5b55a;
  --track:#2a2448; --on-accent:#120f24;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.stripe{height:6px;width:96px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue))}

.sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line)}

.tabs a.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--display);font-stretch:90%;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-stretch:88%;font-weight:800;font-size:20px;margin:0;text-wrap:balance}
.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tests button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px;line-height:1.15;min-height:58px}
.tests button small{font-weight:600;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tests button.on{background:var(--purple);border-color:var(--purple);color:var(--on-accent)}
.tests button.on small{color:var(--on-accent)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;font-weight:700}
.chip .nm{overflow-wrap:anywhere;line-height:1.15}
.chip.on{border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 22%,transparent)}
.chip.next:not(.on){border-style:dashed;border-color:var(--blue)}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);display:block}
.dots i.f{background:var(--ok);border-color:var(--ok)}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.entry{border-color:var(--pink)}
.who{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:28px;line-height:1.05;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.big{flex:1 1 160px;min-width:0;font-family:var(--display);font-weight:800;font-size:34px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px}
.btn.pri{background:var(--pink);border-color:var(--pink);color:var(--on-accent);font-size:18px;padding:10px 22px}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.danger{color:var(--pink)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.hint{color:var(--muted);font-size:13px}

td.n,th.n{font-variant-numeric:tabular-nums}

textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

.rost .r{display:flex;gap:6px;align-items:center}
.rost .r input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}

.modal .card{width:100%;max-width:380px;background:var(--bg)}
.imp .irow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

.imp .meta{grid-column:2;font-size:13px;color:var(--muted)}
.imp input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}

.rhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}

.tile em{font-style:normal;font-size:12px;color:var(--muted)}

.aname h3{font-family:var(--display);font-stretch:82%;font-weight:900;font-size:30px;line-height:1;margin:0;text-transform:uppercase;overflow-wrap:anywhere}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tb{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tb .bigv{font-family:var(--display);font-stretch:86%;font-weight:900;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.tb .bigv small{font-size:16px;font-weight:700;color:var(--muted);margin-left:4px}
.tb .alt{font-size:13px;color:var(--muted);font-weight:600}
.tb.c-pink .bigv{color:var(--pink)} .tb.c-purple .bigv{color:var(--purple)} .tb.c-blue .bigv{color:var(--blue)}
.viz{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.vz{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.vz svg{width:100%;height:auto;display:block;max-height:190px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

.s-pink{stroke:var(--pink)} .s-purple{stroke:var(--purple)} .s-blue{stroke:var(--blue)} .s-track{stroke:var(--track)}
.f-pink{fill:var(--pink)} .f-purple{fill:var(--purple)} .f-blue{fill:var(--blue)} .f-track{fill:var(--track)}
.banner{border:2px dashed var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.empty{color:var(--muted);font-size:14px}
.standalone{padding:20px}
.standalone .report{max-width:860px;margin:0 auto}

@media (max-width:420px){ h1{font-size:25px} .who{font-size:24px} .tests button{font-size:12px} }
@media print{
  :root:root:root{ color-scheme:light;
    --bg:#ffffff; --card:#ffffff; --ink:#17132b; --muted:#555070; --line:#cfcbe2;

  .noprint{display:none !important}
  .wrap{max-width:none;padding:0}
  .standalone{padding:0}
  body{font-size:12px}
  .acard{break-before:page;border:none;padding:0}
  .scroll{overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){ .chip,.btn,.tests button{transition:border-color .12s,background .12s} }

    if(sm&&sm.length>=2) seg=Math.abs(parseFloat(sm[1])-parseFloat(sm[0]))||10; else if(sm&&sm.length===1) seg=parseFloat(sm[0])||10;
    var top=cV>=0?parseFloat(r[cV]):NaN;
    var name=(r[cA]||'').trim();
    var key=[cD>=0?r[cD]:'',cT>=0?r[cT]:'',normName(name),t.toFixed(3),pole?'p':'n'].join('|');
    out.push({name:name, v:t, pole:pole, event:ev, seg:seg, segText:cS>=0?r[cS]:'', top:isFinite(top)?top:null, gates:cG>=0?(r[cG]||''):'', when:((cD>=0?r[cD]:'')+' '+(cT>=0?r[cT]:'')).trim(), key:key, ath:matchAthlete(name), isFly:/fly/i.test(ev)||!ev});
  }
  if(!out.length) return {err:'No timed runs found in that file.'};
  var anyFly=out.some(function(x){return x.isFly;});
  var have={}; S.roster.forEach(function(a){ ['fly','flyp'].forEach(function(t){ trials(a.id,t).forEach(function(tr){ if(tr.key) have[tr.key]=1; }); }); });
  out.forEach(function(x){ x.dup=!!have[x.key]; x.on=!x.dup&&(anyFly?x.isFly:true); x.target=x.ath||(x.name?'new':'skip'); });
  return {rows:out};
}

/* ---------- storage ---------- */
function persist(){
  S.updatedAt=Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  var seed={}; try{ seed=JSON.parse(document.getElementById('seed').textContent); }catch(e){}
  SEED_AT=seed.updatedAt||0;
  var local=null; try{ local=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  S=(local&&local.roster&&(local.updatedAt||0)>=SEED_AT)?local:seed;
  if(!S.results) S.results={}; if(!S.cur) S.cur={test:'bj',ath:null};
  if(!TESTS.some(function(t){return t.id===S.cur.test;})) S.cur.test='bj';
  applyPreloads(seed.preload);
  delete S.preload;
  if(!athById(S.cur.ath)) S.cur.ath=S.roster.length?S.roster[0].id:null;
}
/* results typed in for the user ahead of time: added once, on top of whatever is already on the device */
function applyPreloads(list){
  var changed=false;
  (list||[]).forEach(function(p){
    if(!S.applied) S.applied=[];
    if(S.applied.indexOf(p.id)>=0) return;
    p.rows.forEach(function(r){
      var a=athById(r.id), i;
      if(!a) for(i=0;i<S.roster.length;i++) if(normName(S.roster[i].name)===normName(r.name)) a=S.roster[i];
      if(!a){ a={id:r.id,name:r.name}; S.roster.push(a); }
      if(!S.results[a.id]) S.results[a.id]={};
      if(!S.results[a.id][p.test]) S.results[a.id][p.test]=[];
      r.v.forEach(function(v){ S.results[a.id][p.test].push({v:v,ts:Date.now(),src:'manual'}); });
    });
    S.applied.push(p.id); changed=true;
  });
  if(changed) persist();
}
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,'\\u003c');

}

/* ---------- charts (inline SVG) ---------- */
function barChart(items,color){
  var max=0; items.forEach(function(it){ if(it.value>max) max=it.value; });
  var h=items.length*26+4, s='<svg viewBox="0 0 300 '+h+'" role="img" aria-label="Trials">';
  items.forEach(function(it,i){
    var y=i*26+4, w=max>0?Math.max(2,it.value/max*150):2;
    s+='<text x="0" y="'+(y+14)+'" font-size="12" class="mut">'+esc(it.label)+'</text>';
    s+='<rect x="52" y="'+y+'" width="150" height="18" rx="5" class="f-track"/>';
    s+='<rect x="52" y="'+y+'" width="'+w.toFixed(1)+'" height="18" rx="5" class="f-'+color+'" opacity="'+(it.best?1:.45)+'"/>';
    s+='<text x="208" y="'+(y+14)+'" font-size="12" font-weight="'+(it.best?800:600)+'">'+esc(it.text)+(it.best&&items.length>1?' ★':'')+'</text>';
  });
  return s+'</svg>';
}
function gauge(vNo,vPole){
  var MAXV=12, L1=Math.PI*70, L2=Math.PI*54;
  function arc(r,cls,frac,w){ var x0=90-r, x1=90+r, L=Math.PI*r; return '<path d="M '+x0+' 92 A '+r+' '+r+' 0 0 1 '+x1+' 92" fill="none" stroke-width="'+w+'" stroke-linecap="round" class="'+cls+'"'+(frac==null?'':' stroke-dasharray="'+(L*Math.min(1,frac)).toFixed(1)+' '+(L+10).toFixed(1)+'"')+'/>'; }
  var s='<svg viewBox="0 0 180 112" role="img" aria-label="Fly speed gauge, scale 0 to 12 meters per second">';
  s+=arc(70,'s-track',null,11)+arc(54,'s-track',null,11);
  if(vNo) s+=arc(70,'s-blue',vNo/MAXV,11);
  if(vPole) s+=arc(54,'s-pink',vPole/MAXV,11);
  var top=Math.max(vNo||0,vPole||0);
  s+='<text x="90" y="84" text-anchor="middle" font-size="26" class="dsp">'+(top?top.toFixed(2):'–')+'</text>';
  s+='<text x="90" y="98" text-anchor="middle" font-size="10" class="mut">m/s top fly speed</text>';
  s+='<text x="20" y="109" text-anchor="middle" font-size="10" class="mut">0</text><text x="160" y="109" text-anchor="middle" font-size="10" class="mut">12</text>';
  return s+'</svg>';
}
function ring(pct){
  var C=2*Math.PI*40, f=Math.max(0,Math.min(1,pct/100));
  return '<svg viewBox="0 0 180 112" role="img" aria-label="Pole carryover '+pct.toFixed(0)+' percent">'
   +'<circle cx="90" cy="56" r="40" fill="none" stroke-width="12" class="s-track"/>'
   +'<circle cx="90" cy="56" r="40" fill="none" stroke-width="12" stroke-linecap="round" class="s-purple" stroke-dasharray="'+(C*f).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 90 56)"/>'
   +'<text x="90" y="62" text-anchor="middle" font-size="22" class="dsp">'+pct.toFixed(1)+'%</text></svg>';
}
function splitChart(series){
  var lo=Infinity, hi=-Infinity, maxD=-Infinity, minD=Infinity;
  series.forEach(function(sr){ sr.pts.forEach(function(p){ lo=Math.min(lo,p.v); hi=Math.max(hi,p.v); minD=Math.min(minD,p.from); maxD=Math.max(maxD,p.to); }); });
  if(hi-lo<0.4){ var mid=(hi+lo)/2; lo=mid-0.2; hi=mid+0.2; }
  var pad=(hi-lo)*0.25; lo-=pad; hi+=pad;
  function X(d){ return 30+(d-minD)/(maxD-minD||1)*250; }
  function Y(v){ return 100-(v-lo)/(hi-lo)*80; }
  var s='<svg viewBox="0 0 300 130" role="img" aria-label="Speed through each gate segment">';
  s+='<line x1="30" y1="100" x2="280" y2="100" stroke-width="1" class="s-track"/>';
  var ticks={}; series.forEach(function(sr){ sr.pts.forEach(function(p){ ticks[p.from]=1; ticks[p.to]=1; }); });
  Object.keys(ticks).forEach(function(d){ s+='<line x1="'+X(+d).toFixed(1)+'" y1="20" x2="'+X(+d).toFixed(1)+'" y2="100" stroke-width="1" stroke-dasharray="2 3" class="s-track"/><text x="'+X(+d).toFixed(1)+'" y="114" font-size="10" text-anchor="middle" class="mut">'+trim(+d,1)+' m</text>'; });
  series.forEach(function(sr,si){
    var d='', dots='';
    sr.pts.forEach(function(p,i){ var x=X((p.from+p.to)/2), y=Y(p.v); d+=(i?' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1);
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" class="f-'+sr.color+'"/><text x="'+x.toFixed(1)+'" y="'+(y+(si?16:-8)).toFixed(1)+'" font-size="10" font-weight="700" text-anchor="middle">'+p.v.toFixed(1)+'</text>'; });
    s+='<path d="'+d+'" fill="none" stroke-width="2.5" stroke-linejoin="round" class="s-'+sr.color+'"/>'+dots;
  });
  s+='<text x="30" y="126" font-size="10" class="mut">Speed in m/s between gates</text>';
  return s+'</svg>';
}

/* ---------- report ---------- */
function athleteCard(a){
  var h='', done=0; TESTS.forEach(function(t){ done+=Math.min(trials(a.id,t.id).length,PLANNED); });
  h+='<section class="acard"><div class="aname"><h3>'+esc(a.name)+'</h3><span class="pill '+(done>=TESTS.length*PLANNED?'ok':'')+'">'+done+' of '+(TESTS.length*PLANNED)+' trials</span></div>';
  h+='<div class="tgrid">';
  TESTS.forEach(function(t){
    var tr=trials(a.id,t.id), b=bestTrial(a.id,t.id);
    h+='<div class="tb c-'+t.color+'"><div class="eyebrow">'+esc(t.name)+'</div>';
    if(!b){ h+='<div class="empty">Not tested yet</div></div>'; return; }
    if(t.kind==='jump'){
      h+='<div class="bigv">'+(b.v*0.0254).toFixed(2)+'<small>m</small></div><div class="alt">'+(b.v*2.54).toFixed(1)+' cm · '+esc(ftIn(b.v))+'</div>';
    } else {
      var v=speedOf(b);
      h+='<div class="bigv">'+b.v.toFixed(2)+'<small>s</small></div><div class="alt">'+v.toFixed(2)+' m/s · '+(v*MPH).toFixed(1)+' mph · '+(v*3.6).toFixed(1)+' km/h'+(segOf(b)!==10?' · timed over '+trim(segOf(b),1)+' m':'')+'</div>';
    }
    h+=barChart(tr.map(function(x,i){ return {label:'Trial '+(i+1), value:t.kind==='jump'?x.v:speedOf(x), text:t.kind==='jump'?fmtVal(t.id,x.v):x.v.toFixed(2)+' s', best:x===b}; }),t.color);
    if(tr.length>1){
      var vals=tr.map(function(x){return x.v;}), spread=Math.max.apply(null,vals)-Math.min.apply(null,vals);
      h+='<div class="alt">Trials within '+(t.kind==='time'?spread.toFixed(2)+' s':(spread*2.54).toFixed(1)+' cm')+'</div>';
    }
    h+='</div>';
  });
  h+='</div>';

  var bj=bestTrial(a.id,'bj'), f=bestTrial(a.id,'fly'), fp=bestTrial(a.id,'flyp');
  var tiles='';
  function tile(big,label,note){ tiles+='<div class="tile"><span>'+label+'</span><b>'+big+'</b>'+(note?'<em>'+note+'</em>':'')+'</div>'; }
  if(bj){ var vb0=Math.sqrt(G*bj.v*0.0254); tile(vb0.toFixed(2)+' m/s','Broad jump launch speed','Lowest takeoff speed that covers it'); }
  if(f&&fp){ var a1=speedOf(f), a2=speedOf(fp); tile((a2/a1*100).toFixed(1)+'%','Pole carryover','Speed kept while carrying'); tile((a1-a2>=0?'−':'+')+Math.abs(a1-a2).toFixed(2)+' m/s','Speed change with pole',(fp.v-f.v>=0?'+':'−')+Math.abs(fp.v-f.v).toFixed(2)+' s over 10 m'); }
  var fb=fp||f; if(fb){ var vb=speedOf(fb); tile((vb*3.28084).toFixed(1)+' ft/s',fp?'Runway speed with pole':'Runway speed','One foot every '+(1000/(vb*3.28084)).toFixed(0)+' ms'); }
  if(tiles) h+='<div><div class="eyebrow" style="margin-bottom:6px">Cool stats</div><div class="tiles">'+tiles+'</div></div>';

  var viz='';
  if(f||fp){
    viz+='<div class="vz"><div class="eyebrow">Fly speed</div>'+gauge(f?speedOf(f):0,fp?speedOf(fp):0)+'<div class="leg"><span><i class="f-blue"></i>No pole'+(f?' '+speedOf(f).toFixed(2):'')+'</span><span><i class="f-pink"></i>With pole'+(fp?' '+speedOf(fp).toFixed(2):'')+'</span></div></div>';
  }
  if(f&&fp) viz+='<div class="vz"><div class="eyebrow">Pole carryover</div>'+ring(speedOf(fp)/speedOf(f)*100)+'<div class="leg"><span>Share of no-pole speed kept with the pole</span></div></div>';
  var series=[];
  [['fly','blue','No pole'],['flyp','pink','With pole']].forEach(function(x){ var b=bestTrial(a.id,x[0]); if(b&&b.gates){ var p=gateSplits(b.gates); if(p.length>=2) series.push({pts:p,color:x[1],name:x[2]}); } });
  if(series.length) viz+='<div class="vz"><div class="eyebrow">GateCamLive splits, best run</div>'+splitChart(series)+'<div class="leg">'+series.map(function(sr){return '<span><i class="f-'+sr.color+'"></i>'+sr.name+'</span>';}).join('')+'</div></div>';
  if(viz) h+='<div class="viz">'+viz+'</div>';
  return h+'</section>';
}

      +(r.name&&!r.ath?'<option value="new"'+(r.target==='new'?' selected':'')+'>Add “'+esc(r.name)+'” to roster</option>':'')+'<option value="skip"'+(r.target==='skip'?' selected':'')+'>Skip this run</option>';
    h+='<div class="irow"><input type="checkbox" id="imp'+i+'" data-imp="'+i+'"'+(r.on?' checked':'')+' aria-label="Include run"><div><b>'+r.v.toFixed(2)+' s</b> · '+(r.pole?'With pole':'No pole')+' · <select data-impsel="'+i+'" id="impsel'+i+'" aria-label="Athlete for this run">'+opts+'</select></div>'
      +'<div class="meta">'+esc(r.name||'No name')+(r.event?' · '+esc(r.event):'')+(r.segText?' · '+esc(r.segText):'')+(r.when?' · '+esc(r.when):'')+(r.dup?' · already imported':'')+(!r.isFly?' · not a fly run':'')+'</div></div>';
  });
  h+='<div class="row"><button class="btn pri" data-act="impGo">Add '+on+' run'+(on===1?'':'s')+'</button><button class="btn" data-act="impCancel">Cancel</button></div>';
  return h+'</div>';
}
function reportView(){
  var h='<div class="card noprint"><div class="row">'
    +(STANDALONE?'<button class="btn blue" data-act="print">Print report</button><button class="btn" data-act="dlCsv">Download CSV</button>':(ui.downloads?'<button class="btn blue" data-act="dlReport">Download printable report</button><button class="btn" data-act="dlCsv">Download CSV</button>':''))
    +'<button class="btn" data-act="copy">Copy results as text</button></div>'
    +'<div class="hint">'+(STANDALONE?'Prints one athlete per page. On a phone, choose Save to Files or AirPrint in the print sheet.':ui.downloads?'The downloaded report opens in any browser and prints one athlete per page.':'To print, open this page in a browser and use its Print command. Each athlete gets a page.')+'</div>'
    +(ui.msg?'<div class="msg '+ui.msg.kind+'">'+esc(ui.msg.text)+'</div>':'')+'</div>';
  h+='<div class="report">'+reportHTML();
  if(!anyTrials()) h+='<div class="banner noprint">Example only. This is what each athlete sheet looks like once trials are in. It disappears when you record the first result.</div><div class="noprint">'+exampleCard()+'</div>';
  return h+'</div>';
}
function setupView(){
  var h='<div class="card"><div class="eyebrow">Session</div><div class="row"><label class="field" for="fDate">Date<input id="fDate" type="date" value="'+esc(S.date)+'"></label><label class="field" for="fLoc">Location<input id="fLoc" type="text" value="'+esc(S.location)+'" placeholder="USF track"></label></div></div>';
  h+='<div class="card"><div class="eyebrow">Roster and order</div><div class="rost">'+S.roster.map(function(a,i){
    return '<div class="r"><input type="text" id="nm_'+a.id+'" data-name="'+a.id+'" value="'+esc(a.name)+'" aria-label="Athlete name"><button class="btn sm" data-act="up" data-id="'+a.id+'" aria-label="Move up"'+(i===0?' disabled':'')+'>↑</button><button class="btn sm" data-act="down" data-id="'+a.id+'" aria-label="Move down"'+(i===S.roster.length-1?' disabled':'')+'>↓</button><button class="btn sm danger" data-act="rm" data-id="'+a.id+'">'+(ui.confirm==='rm'+a.id?'Tap again to remove':'Remove')+'</button></div>';
  }).join('')+'</div><form class="row" id="addForm"><input class="btn" style="flex:1;text-align:left;font-weight:600" id="addName" type="text" placeholder="Add an athlete" autocomplete="off" aria-label="New athlete name"><button class="btn blue" type="submit">Add</button></form></div>';
  if(STANDALONE){
    h+='<div class="card"><div class="eyebrow">Backup</div><div class="hint">Results save on this device right away and the app works with no wifi. They live only in this browser, so download a backup after practice.</div><div class="row"><button class="btn blue" data-act="dlBackup">Download backup</button><label class="btn" for="bkFile" style="display:inline-flex;align-items:center">Restore a backup</label><input id="bkFile" type="file" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px">'
      +'<button class="btn danger" data-act="reset">'+(ui.confirm==='reset'?'Tap again to erase all results':'Erase all results')+'</button></div>'
      +(ui.msg?'<div class="msg '+ui.msg.kind+'">'+esc(ui.msg.text)+'</div>':'')+'</div>';
    return h;
  }
  h+='<div class="card"><div class="eyebrow">Backup</div><div class="hint">Every result saves on this device right away, even with no wifi. Back up to the page when you have a connection so the results open on your other devices too. The page reloads when it finishes.</div><div class="row">'
    +(ui.artifact?'<button class="btn pri" data-act="publish"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Backing up…':'Back up to this page')+'</button>':'<span class="pill">Page backup is not available in this view</span>')
    +'<button class="btn danger" data-act="reset">'+(ui.confirm==='reset'?'Tap again to erase all results':'Erase all results')+'</button></div>'
    +(ui.msg?'<div class="msg '+ui.msg.kind+'">'+esc(ui.msg.text)+'</div>':'')+'</div>';
  return h;
}
function modal(){
  if(!ui.edit) return '';
  var a=athById(ui.edit.ath), t=testById(S.cur.test), tr=trials(ui.edit.ath,t.id)[ui.edit.i]; if(!a||!tr) return '';
  return '<div class="modal" data-act="closeEdit"><form class="card" id="editForm" data-stop="1"><div class="eyebrow">'+esc(t.name)+' · Trial '+(ui.edit.i+1)+'</div><h2>'+esc(a.name)+'</h2><input class="big" id="editInput" inputmode="'+(t.kind==='jump'?'text':'decimal')+'" value="'+esc(rawVal(t.id,tr.v))+'" aria-label="Corrected result">'
    +(ui.edit.err?'<div class="msg warn">'+esc(ui.edit.err)+'</div>':'')
    +'<div class="row"><button class="btn pri" type="submit">Save</button><button class="btn danger" type="button" data-act="delTrial">Delete trial</button><button class="btn" type="button" data-act="closeEdit" data-force="1">Cancel</button></div></form></div>';
}
function render(focus){
  var app=document.getElementById('app');
  app.innerHTML='<div class="wrap">'+header()+(ui.view==='report'?reportView():ui.view==='setup'?setupView():recordView())+'</div>'+modal();
  if(focus){ var el=document.getElementById(focus); if(el){ try{ el.focus(); if(el.select&&focus==='editInput') el.select(); }catch(e){} } }
}

/* ---------- actions ---------- */
function setMsg(kind,text,undo){ ui.msg={kind:kind,text:text,undo:undo||null}; }
function saveEntry(){
  var inp=document.getElementById('entryInput'), t=testById(S.cur.test), a=athById(S.cur.ath); if(!inp||!a) return;
  var p=parseEntry(t.id,inp.value);
  if(p.err){ setMsg('warn',p.err); ui.warnKey=null; render('entryInput'); return; }
  var key=t.id+a.id+inp.value;
  if(p.odd&&ui.warnKey!==key){ ui.warnKey=key; setMsg('warn',fmtVal(t.id,p.v)+' looks unusual for this test. Tap Save anyway if it is right.'); var keep=inp.value; render('entryInput'); document.getElementById('entryInput').value=keep; return; }
  ui.warnKey=null;
  if(!S.results[a.id]) S.results[a.id]={};
  if(!S.results[a.id][t.id]) S.results[a.id][t.id]=[];
  S.results[a.id][t.id].push({v:p.v,ts:Date.now(),src:'manual'});
  setMsg('ok','Saved '+fmtVal(t.id,p.v)+' for '+a.name+'.',{ath:a.id,test:t.id});
  S.cur.ath=nextAthlete(t.id,a.id);
  persist(); render('entryInput');
}
function doImport(){
  var n=0;
  ui.imp.rows.forEach(function(r){
    if(!r.on||r.target==='skip') return;
    var aid=r.target;
    if(aid==='new'){ var ex=matchAthlete(r.name); if(ex) aid=ex; else { aid='a'+Date.now().toString(36)+Math.floor(Math.random()*1e4); S.roster.push({id:aid,name:r.name}); } }
    if(!athById(aid)) return;
    var tid=r.pole?'flyp':'fly';
    if(!S.results[aid]) S.results[aid]={};
    if(!S.results[aid][tid]) S.results[aid][tid]=[];
    S.results[aid][tid].push({v:r.v,ts:Date.now(),src:'gatecam',seg:r.seg,top:r.top,gates:r.gates,key:r.key});
    n++;
  });
  ui.imp=null; ui.impErr=null; setMsg('ok','Added '+n+' GateCamLive run'+(n===1?'':'s')+'.'); persist(); render();
}
function readImport(text){
  var res=parseGateCam(text);
  if(res.err){ ui.impErr=res.err; ui.imp=null; } else { ui.imp=res; ui.impErr=null; }
  render();
}
function onClick(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(act==='closeEdit'){ if(!el.getAttribute('data-force')&&e.target.closest('[data-stop]')) return; ui.edit=null; render(); return; }
  if(act!=='rm'&&act!=='reset') ui.confirm=null;
  if(act==='test'){ S.cur.test=id; S.cur.ath=nextAthlete(id,null); ui.msg=null; ui.warnKey=null; persist(); render(); }
  else if(act==='ath'){ S.cur.ath=id; ui.msg=null; ui.warnKey=null; persist(); render('entryInput'); }
  else if(act==='undo'){ var u=ui.msg&&ui.msg.undo; if(u){ var arr=trials(u.ath,u.test); arr.pop(); S.cur.ath=u.ath; S.cur.test=u.test; setMsg('ok','Removed the last result.'); persist(); render('entryInput'); } }
  else if(act==='edit'){ ui.edit={ath:el.getAttribute('data-ath'),i:+el.getAttribute('data-i')}; render('editInput'); }
  else if(act==='delTrial'){ trials(ui.edit.ath,S.cur.test).splice(ui.edit.i,1); ui.edit=null; ui.msg=null; persist(); render(); }
  else if(act==='paste'){ ui.paste=!ui.paste; render(ui.paste?'gcText':null); }
  else if(act==='pasteGo'){ readImport(document.getElementById('gcText').value); }
  else if(act==='impGo'){ doImport(); }
  else if(act==='impCancel'){ ui.imp=null; render(); }
  else if(act==='up'||act==='down'){ var i=S.roster.indexOf(athById(id)), j=i+(act==='up'?-1:1); if(i>=0&&j>=0&&j<S.roster.length){ var tmp=S.roster[i]; S.roster[i]=S.roster[j]; S.roster[j]=tmp; persist(); render(); } }
  else if(act==='rm'){ if(ui.confirm!=='rm'+id){ ui.confirm='rm'+id; render(); return; } ui.confirm=null; S.roster=S.roster.filter(function(a){return a.id!==id;}); delete S.results[id]; if(S.cur.ath===id) S.cur.ath=S.roster.length?S.roster[0].id:null; persist(); render(); }
  else if(act==='reset'){ if(ui.confirm!=='reset'){ ui.confirm='reset'; render(); return; } ui.confirm=null; S.results={}; setMsg('ok','All results erased.'); persist(); render(); }
  else if(act==='publish'){ doPublish(); }
  else if(act==='copy'){ var txt=resultsText(); try{ navigator.clipboard.writeText(txt).then(function(){ setMsg('ok','Results copied.'); render(); },function(){ setMsg('warn','Copy is blocked in this view.'); render(); }); }catch(err){ setMsg('warn','Copy is blocked in this view.'); render(); } }
  else if(act==='dlReport'){ saveFile('baseline-report-'+S.date+'.html','<!DOCTYPE html>\n<html lang="en" data-theme="light"><head>'+HEAD.replace('Vault Squad Baseline Testing','Baseline Testing Report '+S.date)+'<style>'+document.getElementById('css').textContent+'</style></head><body class="standalone"><main class="report">'+reportHTML()+'</main></body></html>'); }
  else if(act==='print'){ try{ window.print(); }catch(err){} }
  else if(act==='dlBackup'){ saveFile('baseline-backup-'+S.date+'.json',JSON.stringify(S)); }
  else if(act==='dlCsv'){ saveFile('baseline-results-'+S.date+'.csv',resultsCSV()); }
}
function saveFile(name,data){
  if(STANDALONE){
    try{ var url=URL.createObjectURL(new Blob([data],{type:/\.csv$/.test(name)?'text/csv':'application/json'})), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },4000); setMsg('ok','Saved '+name+'.'); }
    catch(err){ setMsg('warn','Could not save the file on this device.'); }
    render(); return;
  }
  if(!ui.downloads) return;
  ui.downloads.save({filename:name,data:data}).then(function(){ setMsg('ok','Saved '+name+'.'); render(); },function(err){ setMsg('warn',err&&err.code==='declined'?'Download cancelled.':'Could not save the file here.'); render(); });
}
function doPublish(){
  if(!ui.artifact||ui.busy) return;
  ui.busy=true; render();
  ui.artifact.publish(buildDoc()).then(function(){ SEED_AT=S.updatedAt; ui.busy=false; setMsg('ok','Backed up.'); render(); },function(err){ ui.busy=false; setMsg('warn','Backup did not go through'+(err&&err.code?' ('+err.code+')':'')+'. Your results are still saved on this device.'); render(); });
}
function onSubmit(e){
  e.preventDefault();
  if(e.target.id==='entryForm') saveEntry();
  else if(e.target.id==='editForm'){
    var p=parseEntry(S.cur.test,document.getElementById('editInput').value);
    if(p.err){ ui.edit.err=p.err; render('editInput'); return; }
    trials(ui.edit.ath,S.cur.test)[ui.edit.i].v=p.v; ui.edit=null; ui.msg=null; persist(); render();
  }
  else if(e.target.id==='addForm'){ var nm=document.getElementById('addName').value.trim(); if(nm){ var id='a'+Date.now().toString(36); S.roster.push({id:id,name:nm}); if(!S.cur.ath) S.cur.ath=id; persist(); render('addName'); } }
}
function onChange(e){
  var el=e.target;
  if(el.id==='gcFile'&&el.files&&el.files[0]){ var fr=new FileReader(); fr.onload=function(){ readImport(String(fr.result||'')); }; fr.onerror=function(){ ui.impErr='Could not read that file.'; render(); }; fr.readAsText(el.files[0]); }
  else if(el.id==='bkFile'&&el.files&&el.files[0]){ var br=new FileReader(); br.onload=function(){ try{ var d=JSON.parse(String(br.result||'')); if(!d||!Array.isArray(d.roster)||typeof d.results!=='object') throw 0; var ap=(S.applied||[]).concat(d.applied||[]); S=d; S.applied=ap; if(!S.cur) S.cur={test:'vj',ath:null}; if(!athById(S.cur.ath)) S.cur.ath=S.roster.length?S.roster[0].id:null; persist(); setMsg('ok','Backup restored.'); }catch(err){ setMsg('warn','That file is not a baseline backup.'); } render(); }; br.readAsText(el.files[0]); }
  else if(el.hasAttribute('data-imp')){ ui.imp.rows[+el.getAttribute('data-imp')].on=el.checked; render(); }
  else if(el.hasAttribute('data-impsel')){ var r=ui.imp.rows[+el.getAttribute('data-impsel')]; r.target=el.value; if(el.value!=='skip') r.on=true; render(); }
  else if(el.id==='fDate'){ if(el.value){ S.date=el.value; persist(); render(); } }
  else if(el.id==='fLoc'){ S.location=el.value.trim(); persist(); }
  else if(el.hasAttribute('data-name')){ var a=athById(el.getAttribute('data-name')); if(a&&el.value.trim()){ a.name=el.value.trim(); persist(); } }
}
function route(){
  var hsh=(location.hash||'').replace('#','');
  ui.view=(hsh==='report'||hsh==='setup')?hsh:'record'; ui.msg=null; ui.confirm=null; ui.edit=null;
  render();
}
function init(){
  load();
  document.addEventListener('click',onClick);
  document.addEventListener('submit',onSubmit);
  document.addEventListener('change',onChange);
  window.addEventListener('hashchange',route);
  route();
  if(STANDALONE&&'serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){} }
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(a){ if(a){ ui.artifact=a; if(ui.view==='setup') render(); } },function(){});
    window.claude.use('downloads').then(function(d){ if(d){ ui.downloads=d; if(ui.view==='report') render(); } },function(){});
  }
}
if(typeof document!=='undefined') init();
else if(typeof module!=='undefined') module.exports={parseGateCam:parseGateCam,parseEntry:parseEntry,reportHTML:reportHTML,exampleCard:exampleCard,nextAthlete:nextAthlete,resultsCSV:resultsCSV,setState:function(s){S=s;},gateSplits:gateSplits};
</script></body></html>
