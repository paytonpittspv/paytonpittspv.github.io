  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

.tabs button, .themes button { font: inherit; cursor: pointer; border: 0; border-radius: 99px; background: transparent; color: var(--muted); font-weight: 600; }

.tabs button:focus-visible, .themes button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

<script>

(function () {
  function lsG(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
  function lsS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  function setTheme(m) {
    lsS('chord.theme', m);
    if (m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', m);
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === m)));
  }
  setTheme(lsG('chord.theme', 'dark'));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeSet)));
  function show(tab) {
    const review = tab === 'review';
    document.getElementById('season').hidden = review;
    document.getElementById('check').hidden = !review;
    document.getElementById('tab-season').setAttribute('aria-selected', String(!review));
    document.getElementById('tab-review').setAttribute('aria-selected', String(review));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.tab; if (location.hash !== '#' + t) location.hash = t; else show(t);
  }));
  window.addEventListener('hashchange', () => show(location.hash === '#review' ? 'review' : 'season'));
  show(location.hash === '#review' ? 'review' : 'season');
})();
(function () {

const CHORD_CHECK = '#review';
const DEFAULTS = {
  start: '2026-10-27',          // program start (week 1 = the Mon–Sun week containing it)
  bed: '21:45',                 // lights out (8+ h before ~6:00 wake for 7:00 practice)
  firstMeet: '2027-01-15',
  lastMeet: '2027-06-18',
  breakStart: '2027-03-15',     // Monday after indoor ends (editable)
  breakWeeks: 4,
  meets: ['2027-01-15', '2027-06-18']
};
const PH = {
  pre: { name: 'Before the program', color: '--line', short: 'Pre' },
  p1:  { name: 'Phase 1 · Build the strut', color: '--p1', short: 'Build' },
  p2:  { name: 'Phase 2 · Transfer', color: '--p2', short: 'Transfer' },
  p3:  { name: 'Phase 3 · Load and compete', color: '--p3', short: 'Load' },
  in:  { name: 'Indoor season', color: '--pin', short: 'Indoor' },
  br:  { name: 'Reset break', color: '--pbr', short: 'Break' },
  or:  { name: 'Outdoor rebuild', color: '--por', short: 'Rebuild' },
  oc:  { name: 'Outdoor season', color: '--poc', short: 'Outdoor' },
  tp:  { name: 'Peak for the last meet', color: '--ptp', short: 'Peak' },
  post:{ name: 'Season complete', color: '--line', short: 'Done' },
};

// ---------- dates (UTC-safe) ----------
const D = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const S = t => new Date(t).toISOString().slice(0, 10);
const DAY = 864e5;
const add = (s, n) => S(D(s) + n * DAY);
const dow = s => (new Date(D(s)).getUTCDay() + 6) % 7; // 0 = Mon
const monday = s => add(s, -dow(s));
const diff = (a, b) => Math.round((D(a) - D(b)) / DAY);
const todayStr = () => { const n = new Date(); return S(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const fmt = (s, o) => new Date(D(s)).toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

// ---------- state ----------
let cfg = { ...DEFAULTS };
let checks = {}; // date -> {itemId: true}
let db = null, store = 'local';
let sel = null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2000); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ---------- season model ----------
function bounds() {
  const base = monday(cfg.start);
  const prepEnd = add(base, 84);                      // end of 12-week program
  const bS = monday(cfg.breakStart);
  const bE = add(bS, 7 * cfg.breakWeeks);
  const rebuildEnd = add(bE, 14);
  const peakStart = add(cfg.lastMeet, -13);
  return { base, prepEnd, bS, bE, rebuildEnd, peakStart };
}
function phaseOf(s) {
  const b = bounds();
  if (s < cfg.start) return { key: 'pre' };
  if (s > cfg.lastMeet) return { key: 'post' };
  const wk = Math.floor(diff(s, b.base) / 7) + 1;
  if (s < b.prepEnd) {
    const key = wk <= 4 ? 'p1' : wk <= 8 ? 'p2' : 'p3';
    return { key, wk, deload: wk % 4 === 0 };
  }
  if (s < b.bS) return { key: 'in', wk: Math.floor(diff(s, b.prepEnd) / 7) + 1 };
  if (s < b.bE) return { key: 'br', wk: Math.floor(diff(s, b.bS) / 7) + 1 };
  if (s < b.rebuildEnd) return { key: 'or', wk: Math.floor(diff(s, b.bE) / 7) + 1 };
  if (s >= b.peakStart) return { key: 'tp', wk: Math.floor(diff(s, b.peakStart) / 7) + 1 };
  return { key: 'oc', wk: Math.floor(diff(s, b.rebuildEnd) / 7) + 1 };
}
const isMeet = s => cfg.meets.includes(s);

// ---------- daily content ----------
const I = (id, name, dose, cue) => ({ id, name, dose, cue });

function drills(full) {
  const a = [
    I('d_wall', 'Wall plant', '2 × 5', 'Hold 2 s. Hands forward of the forehead, bottom arm locked, chest behind the pole.'),
  ];
  if (full) a.push(
    I('d_walk', 'Walking pole plants into box', '2 × 4', 'Tip hits the back of the box first; hands rise as it loads.'),
    I('d_carry', 'Pole carry → plant (3 lefts)', '1 × 6', 'Feel the run go through the pole, not up.'));
  a.push(I('d_freeze', 'Take-off freeze', '1 × 5', 'Freeze the take-off. Partner checks bottom arm and trunk.'));
  return a;
}
function strutA(sets, iso) {
  return [
    I('a_iso', 'Plant-position isometric (partner/band)', `${sets} × 3 × ${iso} s`, 'Top arm overhead, bottom arm extended, trunk braced. Nothing gives.'),
    I('a_sapd', 'Straight-arm lat pulldown', `${sets} × 10`, 'Shoulder extension strength for the support phase.'),
    I('a_pull', 'DB or barbell pullover', `${sets} × 8`, 'Full overhead range under control.'),
    I('a_wheel', 'Ab-wheel rollout', `${sets} × 6–8`, 'No low-back sag. Trunk does not bow toward the pit.'),
    I('a_hollow', 'Hollow hold', `${sets} × 30 s`, 'Ribs down; same shape as the swing.'),
  ];
}
function strutB(sets) {
  return [
    I('b_swing', 'Rope or high-bar swing', `${sets} × 5`, 'Long swing, hips leading up.'),
    I('b_inv', 'Inverted pull-down / bar inversion', `${sets} × 4–5`, 'Hips stay close to the bar line: hips up the chord.'),
    I('b_carry', 'Single-arm overhead carry', `${sets} × 30 m each`, 'Locked arm, trunk stacked.'),
    I('b_land', 'Landmine overhead hold', `${sets} × 20 s`, 'Arm long, forward and up, like the bottom arm at plant.'),
    I('b_pallof', 'Pallof press', `${sets} × 10 each`, 'Anti-rotation; stay in the pole plane.'),
  ];
}
function legs(light, sets) {
  const s = light ? Math.max(2, sets - 1) : sets;
  return [
    I('l_pogo', 'Pogo hops', `${s} × ${light ? 10 : 15}`, 'Stiff ankle, short contacts. Only once cleared by the ATC.'),
    I('l_hang', 'Hanging knee-to-chest / leg raise', `${s} × 8`, 'Hip flexor strength for the drive knee and swing.'),
    I('l_knee', 'Banded knee drive', `${s} × ${light ? 8 : 10} each`, 'Fast drive knee at take-off.'),
    I('l_catch', 'Eccentric plant catch (band)', `3 × 5`, 'Step into the plant against a heavy band and stop instantly.'),
    I('l_calf', 'Single-leg calf raise, slow down', `${s} × 10`, 'Take-off ankle durability.'),
  ];
}
function poleRuns(key, wk) {
  if (key === 'p1' || (key === 'or' && wk === 1)) return [I('r_pole', 'Pole runs ending in a plant (6 lefts)', '2–3 reps', 'Plant into the box, no take-off. Run through the pole.')];
  if (key === 'p2' || key === 'or') return [I('r_pole', 'Mid-approach plant + take-off run-throughs', '3–4 reps', 'Film from the side; note velocity at touchdown and take-off.')];
  if (key === 'p3') return [I('r_pole', 'Full-approach run-throughs', '2–3 reps', 'Competition speed. Hands forward, run off the ground.')];
  return [I('r_pole', 'Run-throughs with plant', '2 reps', 'Competition speed; keep the plant sharp.')];
}
function jumping(key, wk, day) {
  const film = I('j_film', 'Film every jump (side + rear)', '', 'Highest frame rate your phone allows.');
  const rev = I('j_review', 'Review jumps in Chord Check', '', `<a href="${CHORD_CHECK}" >Open Review</a> · one cue for next session.`);
  let j;
  if (key === 'p1' || (key === 'or' && wk === 1)) j = I('j_jump', 'Short-approach jumps (4–6 lefts)', '8–12 jumps', 'One cue per jump.');
  else if (key === 'p2' || key === 'or') j = I('j_jump', 'Build approach 6 → 8 → 10 lefts', '8–10 jumps', 'Step up only after the Chord Check gate is green.');
  else if (key === 'p3') j = I('j_jump', 'Mid to full approach', '6–8 jumps', 'Add work in the swing while hips stay on the chord.');
  else if (key === 'tp') j = I('j_jump', 'Quality jumps, mid to full approach', '4–6 jumps', 'Sharp, fresh, one cue.');
  else j = I('j_jump', day === 'thu' ? 'Short-approach technical jumps' : 'Mid to full approach jumps', day === 'thu' ? '4–6 jumps' : '6–8 jumps', 'Coach’s session; carry your one cue.');
  return [j, film, rev];
}

// ---------- Compex + sleep ----------
const meetWithin = (s, n) => Array.from({ length: n }, (_, i) => add(s, i + 1)).some(isMeet);
function compexItems(s, k, d, kind, deload) {
  if (k === 'pre' || k === 'post' || kind === 'meet') return [];
  if (kind === 'primer') return [I('c_none', 'No Compex strength today', '', 'Nothing hard within 48 h of a meet. Recovery program only if legs feel heavy.')];
  const rec = (id, where) => I(id, `Compex · Active Recovery (${where})`, '1 session', 'Low intensity, comfortable twitch. Do it the evening of a hard day.');
  const rehab = I('c_rehab', 'Compex · rehab program', '1 session', 'Use the Rehabilitation category on the muscles your athletic trainer is targeting. Pair with your rehab sheet. Drop this once you are cleared.');
  const abs = I('c_abs', 'Compex · Strength on abs, holding a plank', '1 session', 'Brace against every contraction, same shape as the take-off strut.');
  const strengthOK = !meetWithin(s, 2) && k !== 'tp' && k !== 'br';
  const calves = I('c_calf', 'Compex · Strength on calves + tibialis', '1 session', 'Ankle stiffness for take-off. Raise intensity gradually; stop if the ankle complains.');
  const glutes = I('c_glute', 'Compex · Explosive Strength on glutes', '1 session', 'Bridge position, 6-pad glute placement. Stretch hamstrings first; stop at the first cramp, don’t chase the number.');
  if (kind === 'recover') return [rec('c_rec', 'legs + back'), rehab];
  if (k === 'br') return (d === 2 || d === 6) ? [I('c_rec', 'Compex · Recovery or Massage (optional)', '1 session', 'Only if you want it.')] : [];
  const out = [];
  if (d === 0) out.push(rec('c_rec', 'calves + quads'));
  if (d === 1) { if (strengthOK && !deload) out.push(calves); else out.push(rec('c_rec', 'calves')); }
  if (d === 2) { out.push(rehab); if (k !== 'tp') out.push(abs); }
  if (d === 3) out.push(rec('c_rec', 'hamstrings + calves'));
  if (d === 4) { if (strengthOK && !deload) out.push(glutes); else out.push(rec('c_rec', 'glutes + hamstrings')); }
  if (d === 6) out.push(rehab, rec('c_rec2', 'back + lats'));
  return out;
}
function to12(t) { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; }
function sleepItems(s, k, kind) {
  if (k === 'pre' || k === 'post') return [];
  const bed = cfg.bed || DEFAULTS.bed;
  const out = [I('z_wind', 'Screens off, wind down', '30 min before bed', 'Light band work or stretching is fine. Cool, dark room.'),
    I('z_bed', `Lights out by ${to12(bed)}`, '8–9 h', 'Same wake time every day, weekends included.')];
  if (kind === 'primer') out[1] = I('z_bed', `Lights out by ${to12(bed)}`, '9 h', 'Most important sleep of the week. Pack your bag before bed.');
  if (kind === 'meet') out.splice(0, 2, I('z_bed', 'Back to normal bedtime tonight', '8–9 h', 'Even after a late meet, protect the next two nights.'));
  if (dow(s) === 5 && kind !== 'meet') out.push(I('z_nap', 'Optional nap', '20–30 min', 'Before 3 PM so it doesn’t push back bedtime.'));
  return out;
}

function dayPlan(s) {
  const out = corePlan(s), k = out.phase.key;
  const cx = compexItems(s, k, dow(s), out.kind, out.phase.deload);
  if (cx.length) out.sections.push({ t: 'Compex · evening', items: cx });
  const zz = sleepItems(s, k, out.kind);
  if (zz.length) out.sections.push({ t: 'Sleep', items: zz });
  return out;
}

function corePlan(s) {
  const ph = phaseOf(s), k = ph.key, d = dow(s);
  const out = { phase: ph, sections: [], note: '', kind: 'train' };
  if (k === 'pre') { out.kind = 'rest'; out.note = `The program starts ${fmt(cfg.start, { weekday: 'long', month: 'short', day: 'numeric' })}.`; return out; }
  if (k === 'post') { out.kind = 'rest'; out.note = 'Season complete. Enjoy the rest.'; return out; }

  // meet overrides
  if (isMeet(s)) {
    out.kind = 'meet';
    out.sections.push({ t: 'Meet day', items: [
      I('m_drill', 'Plant warm-up: wall plants + walking plants', '1 × 5, 1 × 3', 'Hands forward, bottom arm long. Then your normal warm-up.'),
      I('m_cue', 'Pick ONE cue for the day', '', 'Use the last cue from Chord Check.'),
      I('m_film', 'Get every jump filmed (side + rear)', '', 'Ask a teammate or coach before warm-ups.'),
      I('m_log', 'Log height, pole and grip', '', 'Enter them in Chord Check after the meet.'),
    ]});
    return out;
  }
  if (isMeet(add(s, 1)) && k !== 'br') {
    out.kind = 'primer';
    out.sections.push({ t: 'Pre-meet primer', items: [
      I('p_wall', 'Wall plant', '1 × 5', 'Crisp, not tiring.'),
      I('p_iso', 'Plant-position isometric', '2 × 3 × 3 s', 'Fast onset, full stiffness.'),
      I('p_runs', 'Short pole runs', '2 reps', 'Rhythm and plant timing only.'),
      I('p_mob', 'Mobility + light band activation', '10 min', 'No heavy lifting today.'),
    ]});
    return out;
  }
  if (isMeet(add(s, -1)) && k !== 'br') {
    out.kind = 'recover';
    out.sections.push({ t: 'Post-meet recovery', items: [
        I('rc_mob', 'Light mobility and band work', '15 min', ''),
      I('rc_rev', 'Review meet jumps in Chord Check', '', `<a href="${CHORD_CHECK}" >Open Review</a>`),
    ]});
    return out;
  }

  if (k === 'br') {
    out.kind = 'rest';
    out.note = 'Reset month. No program work. Sleep, recover, and come back hungry.';
    if (d === 2 || d === 5) out.sections.push({ t: 'Optional', items: [I('br_mob', 'Easy mobility, walk or swim', '20–30 min', 'Only if you feel like it.')] });
    return out;
  }

  // sets / iso by phase
  let sets = 3, iso = 6;
  if (k === 'p2') iso = 3;
  if (k === 'p3') { sets = 2; iso = 3; }
  if (k === 'in' || k === 'oc') { sets = 2; iso = 3; }
  if (k === 'or') { sets = 3; iso = ph.wk === 1 ? 6 : 3; }
  if (k === 'tp') { sets = 2; iso = 3; }
  if (ph.deload) sets = 2;

  const comp = k === 'in' || k === 'oc' || k === 'tp';
  if (d === 0) {
    out.sections.push({ t: 'Vault · before jumping', items: drills(true) });
    out.sections.push({ t: 'Vault · jumping', items: jumping(k, ph.wk, 'mon') });
    out.sections.push({ t: 'Lift · Strut A (after main lifts)', items: k === 'tp' ? strutA(sets, iso).slice(0, 1).concat(strutA(sets, iso).slice(3)) : strutA(sets, iso) });
  } else if (d === 1) {
    out.sections.push({ t: 'Run day · after sprints', items: poleRuns(k, ph.wk) });
    out.sections.push({ t: 'Lift · Legs + stiffness', items: k === 'tp' ? legs(true, sets).slice(3) : legs(comp, sets) });
  } else if (d === 2) {
    out.kind = 'rest';
    out.sections.push({ t: 'Optional recovery', items: [
      I('w_mob', 'Mobility + light band work', '15 min', 'Monster walks, banded squats, bear crawls.'),
    ]});
  } else if (d === 3) {
    out.sections.push({ t: 'Vault · before jumping', items: drills(false) });
    out.sections.push({ t: 'Vault · jumping', items: jumping(k, ph.wk, 'thu') });
    out.sections.push({ t: 'Lift · Strut B (after main lifts)', items: k === 'tp' ? strutB(sets).slice(0, 2) : strutB(sets) });
  } else if (d === 4) {
    out.sections.push({ t: 'Run day · after sprints', items: poleRuns(k, ph.wk) });
    out.sections.push({ t: 'Lift · Legs + stiffness (light)', items: k === 'tp' ? legs(true, sets).slice(3, 4) : legs(true, sets) });
  } else if (d === 5) {
    out.kind = 'rest'; out.note = 'Off from training. Keep your normal wake time.';
  } else {
    out.kind = 'rest';
    out.sections.push({ t: 'Weekend', items: [I('s_week', 'Weekly video review in Chord Check', '10–15 min', `Check the progression gate. <a href="${CHORD_CHECK}" >Open Review</a>`)] });
  }
  if (ph.deload) out.note = 'Deload week: about 40% less accessory volume, and no longer approach than last week.';
  if (k === 'p2' && d === 0) out.note = out.note || 'Step up approach length only when the Chord Check gate is green.';
  return out;
}
const allItems = s => dayPlan(s).sections.flatMap(x => x.items);
function dayStatus(s) {
  const its = allItems(s), c = checks[s] || {};
  const done = its.filter(i => c[i.id]).length;
  return { done, total: its.length };
}

// ---------- persistence ----------
async function setCheck(s, id, val) {
  const cur = { ...(checks[s] || {}) };
  if (val) cur[id] = true; else delete cur[id];
  checks[s] = cur;
  render(true);
  if (db) { try { await db.collection('days').doc(s).set({ date: s, done: cur }); return; } catch {} }
  lsSet('chordseason.checks', checks);
}
async function saveCfg() {
  render();
  if (db) { try { await db.doc('settings/main').set(cfg); toast('Saved'); return; } catch {} }
  lsSet('chordseason.cfg', cfg); toast('Saved on this device');
}

// ---------- render ----------
function timeline() {
  const b = bounds(), start = cfg.start, end = add(cfg.lastMeet, 1), total = diff(end, start);
  const segs = [['p1', start, add(b.base, 28)], ['p2', add(b.base, 28), add(b.base, 56)], ['p3', add(b.base, 56), b.prepEnd],
    ['in', b.prepEnd, b.bS], ['br', b.bS, b.bE], ['or', b.bE, b.rebuildEnd], ['oc', b.rebuildEnd, b.peakStart], ['tp', b.peakStart, end]];
  const pct = s => Math.max(0, Math.min(100, diff(s, start) / total * 100));
  const bar = segs.map(([k, a, z]) => `<span title="${PH[k].name}" style="width:${Math.max(0, diff(z, a)) / total * 100}%;background:var(${PH[k].color})"></span>`).join('');
  const meets = cfg.meets.map(m => `<span class="tl-meet" title="Meet ${fmt(m, { month: 'short', day: 'numeric' })}" style="left:${pct(m)}%"></span>`).join('');
  const t = todayStr();
  const mark = t >= start && t <= cfg.lastMeet ? `<span class="tl-mark" style="left:${pct(t)}%"></span>` : '';
  const legend = ['p1', 'p2', 'p3', 'in', 'br', 'or', 'oc', 'tp'].map(k => `<span><i style="background:var(${PH[k].color})"></i>${PH[k].short}</span>`).join('');
  return `<div class="tl-wrap"><div class="tl">${bar}</div>${mark}${meets}</div>
    <div class="row note" style="justify-content:space-between;margin-top:14px"><span>${fmt(start, { month: 'short', day: 'numeric' })}</span><span>${fmt(cfg.lastMeet, { month: 'short', day: 'numeric' })}</span></div>
    <div class="legend">${legend}<span><i style="background:var(--meet);border-radius:50%"></i>Meet</span></div>`;
}

function render(keepScroll) {
  const t = todayStr();
  const first = diff(cfg.firstMeet, t), last = diff(cfg.lastMeet, t);

    <div class="statrow">
      <div class="panel stat"><b>${c.pass}/${c.rated}</b><span>checks passed</span></div>
      <div class="panel stat"><b>${loss !== null ? loss.toFixed(2) : '—'}</b><span>vel. loss m/s</span></div>
      <div class="panel stat"><b>${j.angle ? esc(j.angle) + '°' : '—'}</b><span>take-off angle</span></div>
    </div>
    <section class="panel"><div class="note" style="margin-bottom:6px">${esc([j.approach && j.approach + ' lefts', j.pole, j.grip && 'grip ' + j.grip, j.result].filter(Boolean).join(' · ') || 'No details entered')}</div><ul class="res">${items}</ul></section>
    <label>Notes<textarea id="f-notes" placeholder="What you felt, what the coach said">${esc(j.notes || '')}</textarea></label>
    <div class="row">
      ${isNew ? '<button class="ghost" id="redo">Change answers</button><button class="primary" id="save" style="flex:1">Save jump</button>'
              : '<button class="ghost" id="home">All jumps</button><button class="primary" id="savenotes" style="flex:1">Save notes</button>'}
    </div>
    ${del}
  </div>`;
}

// ---------- events ----------
function newDraft() {
  return { id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: today(), approach: '', pole: '', grip: '', result: '', vTD: '', vTO: '', angle: '', elbow: '', notes: '', results: {}, createdAt: Date.now() };
}
function readSetup() {
  for (const k of ['date', 'approach', 'pole', 'grip', 'result', 'vTD', 'vTO', 'angle', 'elbow']) state.draft[k] = $('#f-' + k).value.trim();
}
function go(view) { state.view = view; state.confirmDel = false; render(); if (!document.getElementById('check').hidden) window.scrollTo(0, 0); lsSet('chordcheck.draft', state.view === 'home' ? null : { draft: state.draft, step: state.step, view: state.view }); }

function bind() {
  const on = (sel, fn) => { const el = $(sel); if (el) el.addEventListener('click', fn); };
  on('#new', () => { state.draft = newDraft(); state.step = 0; go('setup'); });
  on('#cancel', () => go('home'));
  const setup = $('#setup');
  if (setup) setup.addEventListener('submit', e => { e.preventDefault(); readSetup(); state.step = 0; go('review'); });
  document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    state.draft.results[CHECKS[state.step].id] = b.dataset.v;
    if (state.step < CHECKS.length - 1) { state.step++; go('review'); } else go('summary');
  }));
  on('#back', () => { if (state.step > 0) { state.step--; go('review'); } });
  on('#quit', () => go('summary'));
  on('#redo', () => { state.step = 0; go('review'); });
  on('#save', async () => {
    state.draft.notes = $('#f-notes').value.trim();
    const ok = await saveJump({ ...state.draft });
    if (ok) { toast('Jump saved'); state.draft = null; go('home'); }
  });
  on('#home', () => go('home'));
  on('#savenotes', async () => {
    const j = jumps.find(x => x.id === state.detail); if (!j) return;
    await saveJump({ ...j, notes: $('#f-notes').value.trim() }); toast('Notes saved');
  });
  on('#del', () => { state.confirmDel = true; render(); });
  on('#delno', () => { state.confirmDel = false; render(); });
  on('#delyes', async () => { await deleteJump(state.detail); toast('Jump deleted'); go('home'); });
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { state.detail = b.dataset.open; go('detail'); }));
  on('#copycsv', async () => {
    const cols = ['date', 'approach', 'pole', 'grip', 'result', 'vTD', 'vTO', 'angle', 'elbow'];
    const head = [...cols, 'vel_loss', 'must_pass', ...CHECKS.map(c => c.id), 'notes'];
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = sorted().map(j => [...cols.map(k => j[k]), velLoss(j)?.toFixed(2) ?? '', passesMust(j) ? 'yes' : 'no', ...CHECKS.map(c => j.results?.[c.id] || ''), j.notes].map(q).join(','));
    const text = [head.join(','), ...rows].join('\n');
    try { await navigator.clipboard.writeText(text); toast('CSV copied'); }
    catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.width = '100%'; ta.rows = 6; $('#copycsv').after(ta); ta.select(); toast('Select and copy the text below'); }
  });
}


// ---------- boot ----------
const saved = lsGet('chordcheck.draft', null);
if (saved && saved.draft && saved.view !== 'home' && saved.view !== 'detail') { state.draft = saved.draft; state.step = saved.step || 0; state.view = saved.view; }
loadLocal();

(async () => {
  try {
    db = window.claude?.use ? await window.claude.use('db') : null;
  } catch { db = null; }
  if (!db) return;
  store = 'db';
  unsub = db.collection('jumps').orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
    jumps = snap.docs.map(d => d.data());
    const focus = document.activeElement && document.activeElement.id;
    if (focus === 'f-notes' || state.view === 'setup') return; // don't wipe typing
    render();
  }, () => { db = null; store = 'local'; loadLocal(); });
})();

})();
</script>

<script>
(function () {
  const KEYS = ['chordseason.cfg', 'chordseason.checks', 'chordcheck.jumps', 'chord.theme'];
  const msg = t => { document.getElementById('bk-msg').textContent = t; };
  document.getElementById('bk-save').addEventListener('click', () => {
    const data = { app: 'compress-the-chord', version: 1, savedAt: new Date().toISOString(), keys: {} };
    KEYS.forEach(k => { try { const v = localStorage.getItem(k); if (v !== null) data.keys[k] = v; } catch {} });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'compress-the-chord-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    msg('Backup downloaded.');
  });
  document.getElementById('bk-load').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== 'compress-the-chord' || !data.keys) throw new Error('bad');
      Object.entries(data.keys).forEach(([k, v]) => { if (KEYS.includes(k)) localStorage.setItem(k, v); });
      msg('Restored. Reloading…');
      setTimeout(() => location.reload(), 600);
    } catch { msg('That file isn\u2019t a Compress the Chord backup. Pick the .json file you downloaded from this app.'); }
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
